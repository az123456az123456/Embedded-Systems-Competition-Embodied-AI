ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: false  # odom_health_gate alone publishes fresh TF
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: wheel/odometry
    # vx, vy=0 nonholonomic constraint, yaw-rate only; do not double-count wheel pose.
    odom0_config: [false, false, false, false, false, false, true, true, false, false, false, true, false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    imu0: imu/data
    # Gyro yaw rate only: no claim of magnetic absolute heading or gravity-free acceleration.
    imu0_config: [false, false, false, false, false, false, false, false, false, false, false, true, false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
    use_control: false
    reset_on_time_jump: false
    debug: false
