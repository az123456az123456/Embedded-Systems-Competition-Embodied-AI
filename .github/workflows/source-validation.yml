name: Source validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install host-only test tools
        run: sudo apt-get update && sudo apt-get install -y build-essential iverilog
      - name: Verify pure source inventory and build entries
        run: python3 tools/verify_source_tree.py
        working-directory: 小车代码汇总/代码/2026新开发
      - name: Run component tests in temporary directories
        run: python3 tools/run_smoke_tests.py
        working-directory: 小车代码汇总/代码/2026新开发
